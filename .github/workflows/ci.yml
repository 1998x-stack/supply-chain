name: Validate supply-chain data
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_site.py
      - name: Validate frontend syntax
        run: node --check web/assets/app.js

      - name: Validate research skills
        run: python scripts/research_cli.py validate-skills
      - name: Audit synthetic research fixtures
        run: |
          python scripts/research_cli.py audit-ledger --input research/examples/ledger.json
          python scripts/research_cli.py audit-dossier --input research/examples/node-dossier.json

      - name: Audit every eyewear dossier and its ledger (structure only)
        run: python scripts/audit_eyewear.py --output build/research/eyewear_audit.json

      - name: Audit optical PC research example (structure only)
        run: |
          python scripts/research_cli.py audit-ledger --input research/ledgers/eyewear/pc-optical-ledger.json
          python scripts/research_cli.py audit-dossier --input research/dossiers/eyewear/pc-optical-draft.json

      - name: Validate cross-platform skill mirror portability
        run: python tools/sync_skill_mirrors.py --check
