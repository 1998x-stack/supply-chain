name: Publish Supply Chain Atlas
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate research data
        run: python -m unittest discover -s tests -v
      - name: Audit all evidence-linked eyewear dossiers
        run: python scripts/audit_eyewear.py --output build/research/eyewear_audit.json
      - name: Validate second product evidence and frontend
        run: |
          python scripts/validate_intelligence.py data/products/henkel-adhesives/graph.json
          node --check web/assets/node_panel.js
          node --check web/assets/app.js
          node --test tests/test_node_panel.mjs
      - name: Build static site and SQLite database
        run: python scripts/research_cli.py validate-skills && python -m unittest discover -s tests -v && python scripts/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publish
        id: deploy
        uses: actions/deploy-pages@v4
